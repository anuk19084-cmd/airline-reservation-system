<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Register - Airline Reservation System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="register-container">

    <div class="welcome-section">
        <div class="logo">✈ SkyWings</div>

        <h2>Your Journey Begins Here</h2>

        <p>
            Create your account and discover a simpler
            way to search flights, reserve seats and
            manage your bookings.
        </p>
    </div>

    <div class="form-section">

    <h1>✈️Create Account </h1>

    <h2>Register to start your journey</h2>

    <form class="booking-form">

        <label>Full Name:</label>
        <input type="text" id="name" placeholder="Enter your name">

        <label>Email:</label>
        <input type="email" id="email" placeholder="Enter your email">

        <label>Password:</label>
        <input type="password" id="password" placeholder="Create a password">

        <label>Confirm Password:</label>
        <input type="password" id="confirmPassword" placeholder="Confirm your password">

        <button type="button" 
        onclick="registerUser()">
            Register
        </button>

    </form>
            <p class="login-text">
            Already have an account?
            <a href="login.html">login</a>
        </p>

    </div>
</div>

    <script>
function registerUser() {

    let name =
        document.getElementById("name").value;

    let email =
        document.getElementById("email").value;

    let password =
        document.getElementById("password").value;

    let confirmPassword =
        document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
        alert("Passwords do not match!");
        return;
    }

    fetch("/api/register", {
        method: "POST",
        headers: {
            "Content-Type":
                "application/x-www-form-urlencoded"
        },
        body:
            "name=" + encodeURIComponent(name) +
            "&email=" + encodeURIComponent(email) +
            "&password=" + encodeURIComponent(password)
    })
    .then(response => response.text())
    .then(message => {
        alert(message);
    })
    .catch(error => {
        alert("Registration failed!");
        console.log(error);
    });
    window.location.href = "login.html";
}
</script>
</body>
</html>
